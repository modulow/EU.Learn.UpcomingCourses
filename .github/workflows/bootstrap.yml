name: Unpack initial source

on:
  push:
    paths:
      - source.zip
      - source.zip.b64
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          base64 --decode source.zip.b64 > source.zip
          unzip -o source.zip
          git restore --source=HEAD -- .github/workflows
          rm source.zip source.zip.b64
      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Unpack complete project source" || exit 0
          git push
