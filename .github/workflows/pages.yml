name: Deploy catalogue to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static catalogue
        run: npm run build
      - name: Prepare GitHub Pages artifact
        run: |
          rm -rf pages
          mkdir -p pages/assets
          cp -RL dist/client/. pages/
          find -L . -type f -path '*/assets/*' ! -path './node_modules/*' -print -exec cp -L {} pages/assets/ \;
          cp pages/EU.Learn.UpcomingCourses.html pages/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
